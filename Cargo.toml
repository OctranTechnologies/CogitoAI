[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"

[workspace.dependencies]
harness-core = { path = "crates/harness-core" }
harness-context = { path = "crates/harness-context" }
harness-agent = { path = "crates/harness-agent" }
harness-models = { path = "crates/harness-models" }
harness-tools = { path = "crates/harness-tools" }
harness-policy = { path = "crates/harness-policy" }
harness-session = { path = "crates/harness-session" }
harness-git = { path = "crates/harness-git" }
harness-pty = { path = "crates/harness-pty" }
harness-verification = { path = "crates/harness-verification" }
harness-rpc = { path = "crates/harness-rpc" }
harness-cli = { path = "crates/harness-cli" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
globset = "0.4"
regex = "1.11"
thiserror = "2.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
ureq = { version = "2.12", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "allow"

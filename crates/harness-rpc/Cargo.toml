[package]
name = "harness-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Runtime boundary for external harness clients"

[dependencies]
fs2 = "0.4.3"
harness-agent.workspace = true
harness-context.workspace = true
harness-core.workspace = true
harness-models.workspace = true
harness-policy.workspace = true
harness-pty.workspace = true
harness-session.workspace = true
harness-git.workspace = true
harness-tools.workspace = true
harness-verification.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
# Keep unsafe denied except for the documented Windows handle-inheritance guard.
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "allow"
